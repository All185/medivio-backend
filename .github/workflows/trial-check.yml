name: Trial Check Daily

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  check-trials:
    runs-on: ubuntu-latest
    steps:
      - name: Call trial check endpoint
        run: |
          curl -X POST https://medivio-backend.onrender.com/api/v1/trial/check \
            -H "x-cron-secret: ${{ secrets.CRON_SECRET }}" \
            -H "Content-Type: application/json"
